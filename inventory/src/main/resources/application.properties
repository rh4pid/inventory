spring.application.name=inventory
# Database: local MySQL by default (database "inventory" on port 3306, created if missing).
# Production (Render) sets DB_URL / DB_USER / DB_PASSWORD to the Supabase Postgres pooler, e.g.
#   DB_URL=jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
# The password is NOT kept here: put DB_PASSWORD=... in local-secrets.properties (git-ignored).
spring.config.import=optional:file:./local-secrets.properties,optional:file:./inventory/local-secrets.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# The free Supabase pooler allows only a handful of connections per client.
spring.datasource.hikari.maximum-pool-size=5
# The database is far away (~140 ms per round trip), so avoid trips that carry no data:
# keep connections warm in the background instead of pinging before every use (see InventoryApplication),
# and leave auto-commit off so Hibernate doesn't toggle it on each transaction.
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Load lazy relations (a product's category, a member's locations...) for a whole page in one query, not one per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Quote reserved words used as table/column names (e.g. the "user" table) so the schema works on Postgres too.
spring.jpa.properties.hibernate.auto_quote_keyword=true

server.port=${PORT:5001}
default.upload=${UPLOAD_DIR:C:/inventory/uploads}
# Browsers allowed to call the API directly (comma-separated). In production the frontend
# proxies /api to the backend, so this only matters for local development.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB

# JWT: set JWT_SECRET env variable in production (min 32 characters)
jwt.secret=${JWT_SECRET:dev-only-secret-replace-before-going-to-production}

#logging.level.org.springframework.security=TRACE
# TESTING ONLY: every new account and every password reset gets this temporary password
# (people still have to choose their own at first sign-in). Remove this line before going
# live to get a random temporary password each time.
app.temporary-password=Inventory
# Anyone can create an account (set SELF_SIGNUP=false to close sign-up)
app.self-signup=${SELF_SIGNUP:true}
